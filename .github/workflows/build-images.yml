name: Build and push images

# Build all three service images on amd64 and push them to GHCR. The built-in
# GITHUB_TOKEN has packages:write for this repo, so no PAT is required.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "whatsapp-gateway/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't cancel the other images if one fails to build.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: gateway
            context: ./whatsapp-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          # GHCR paths must be lowercase.
          tags: |
            ghcr.io/bimapangestu28/portfolio-${{ matrix.name }}:latest
            ghcr.io/bimapangestu28/portfolio-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
