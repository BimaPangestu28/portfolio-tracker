# Production stack that PULLS prebuilt images from GHCR (built by the
# "Build and push images" GitHub Actions workflow). Use this on the server:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Only this file plus a .env are needed on the server — no source checkout.

services:
  backend:
    image: ghcr.io/bimapangestu28/portfolio-backend:latest
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/portfolio.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      INGEST_MODEL: ${INGEST_MODEL:-gpt-4o}
      INGEST_BASE_URL: ${INGEST_BASE_URL:-https://api.openai.com}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?GATEWAY_TOKEN is required}
      CS_GATEWAY_TOKEN: ${CS_GATEWAY_TOKEN:?CS_GATEWAY_TOKEN is required}
      # Optional: enables the Telegram chatbot channel when set.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Optional: Google Calendar sync. Leave unset to disable.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENC_KEY: ${GOOGLE_TOKEN_ENC_KEY:-}
      # Optional: Upwork OAuth sync. Leave unset to disable.
      UPWORK_CLIENT_ID: ${UPWORK_CLIENT_ID:-}
      UPWORK_CLIENT_SECRET: ${UPWORK_CLIENT_SECRET:-}
      UPWORK_REDIRECT_URI: ${UPWORK_REDIRECT_URI:-}
      UPWORK_TOKEN_ENC_KEY: ${UPWORK_TOKEN_ENC_KEY:-}
    volumes:
      - backend_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/bimapangestu28/portfolio-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  gateway:
    image: ghcr.io/bimapangestu28/portfolio-gateway:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?GATEWAY_TOKEN is required}
    volumes:
      - gateway_auth:/app/auth_state

  cs-gateway:
    image: ghcr.io/bimapangestu28/portfolio-gateway:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      PATH_PREFIX: /cs
      OUTBOUND_ENABLED: "1"
      AUTH_DIR: /app/auth_state
      GATEWAY_TOKEN: ${CS_GATEWAY_TOKEN:?CS_GATEWAY_TOKEN is required}
    volumes:
      - cs_gateway_auth:/app/auth_state

volumes:
  backend_data:
  caddy_data:
  caddy_config:
  gateway_auth:
  cs_gateway_auth:
