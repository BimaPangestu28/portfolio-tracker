# Production stack that PULLS prebuilt images from GHCR (built by the
# "Build and push images" GitHub Actions workflow). Use this on the server:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Only this file plus a .env are needed on the server — no source checkout.

services:
  backend:
    image: ghcr.io/bimapangestu28/portfolio-backend:latest
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/portfolio.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      INGEST_MODEL: ${INGEST_MODEL:-claude-sonnet-4-6}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?GATEWAY_TOKEN is required}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - backend_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/bimapangestu28/portfolio-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  gateway:
    image: ghcr.io/bimapangestu28/portfolio-gateway:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?GATEWAY_TOKEN is required}
    volumes:
      - gateway_auth:/app/auth_state

volumes:
  backend_data:
  caddy_data:
  caddy_config:
  gateway_auth:
