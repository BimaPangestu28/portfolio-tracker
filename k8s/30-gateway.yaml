apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-auth
  namespace: portfolio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: portfolio
spec:
  replicas: 1
  # Baileys credentials live on a ReadWriteOnce volume; only one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: gateway
          image: ghcr.io/bimapangestu28/portfolio-gateway:latest
          imagePullPolicy: Always
          env:
            - name: BACKEND_URL
              value: "http://backend:8080"
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: GATEWAY_TOKEN
          volumeMounts:
            - name: auth
              mountPath: /app/auth_state
      volumes:
        - name: auth
          persistentVolumeClaim:
            claimName: gateway-auth
