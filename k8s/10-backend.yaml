apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: portfolio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portfolio
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume tolerates only one writer, so replace the
  # old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: backend
          image: ghcr.io/bimapangestu28/portfolio-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: DATABASE_URL
              value: "sqlite:///data/portfolio.db"
            - name: LLM_MODEL
              value: "deepseek-v4-flash"
            - name: LLM_BASE_URL
              value: "https://api.deepseek.com/anthropic"
            - name: INGEST_MODEL
              value: "gpt-4o"
            - name: INGEST_BASE_URL
              value: "https://api.openai.com"
            - name: RUST_LOG
              value: "info"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: OPENAI_API_KEY
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: GATEWAY_TOKEN
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: AUTH_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: JWT_SECRET
            # Optional: enables the Telegram chatbot channel when present in the secret.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            # Optional: enables long-term memory when the memory-service is deployed.
            - name: MEMORY_SERVICE_URL
              value: "http://memory-service:8000"
            # Optional: Google Calendar sync. Leave unset / omit from secret to disable.
            - name: GOOGLE_REDIRECT_URI
              value: "https://portfolio.catalystlabs.id/api/google/oauth/callback"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_TOKEN_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: GOOGLE_TOKEN_ENC_KEY
                  optional: true
            # Optional: ClickUp freelance project tools. Omit the keys from the
            # secret to disable (tools return "belum dikonfigurasi", briefing
            # section omitted). Both come from the secret — this is a public repo.
            - name: CLICKUP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: CLICKUP_API_TOKEN
                  optional: true
            - name: CLICKUP_SPACE_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: CLICKUP_SPACE_ID
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: portfolio
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
