apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: portfolio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portfolio
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume tolerates only one writer, so replace the
  # old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: backend
          image: ghcr.io/bimapangestu28/portfolio-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: DATABASE_URL
              value: "sqlite:///data/portfolio.db"
            - name: INGEST_MODEL
              value: "claude-sonnet-4-6"
            - name: RUST_LOG
              value: "info"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ANTHROPIC_API_KEY
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: GATEWAY_TOKEN
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: AUTH_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: JWT_SECRET
            # Optional: enables the Telegram chatbot channel when present in the secret.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: portfolio
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
