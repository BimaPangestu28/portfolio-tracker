apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: portfolio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: portfolio
spec:
  replicas: 1
  # Single-writer graph store on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          ports:
            - containerPort: 7687
          env:
            # Format: "neo4j/<password>" — must match NEO4J_PASSWORD used by
            # the memory-service.
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: NEO4J_AUTH
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neo4j-data
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: portfolio
spec:
  selector:
    app: neo4j
  ports:
    - port: 7687
      targetPort: 7687
