apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: memory-service
          image: ghcr.io/bimapangestu28/portfolio-memory:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: NEO4J_PASSWORD
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: OPENAI_API_KEY
            - name: MEMORY_LLM_MODEL
              value: "claude-haiku-4-5-20251001"
            - name: GRAPHITI_TELEMETRY_ENABLED
              value: "false"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: portfolio
spec:
  selector:
    app: memory-service
  ports:
    - port: 8000
      targetPort: 8000
