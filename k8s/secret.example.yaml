# Template for the application secret. DO NOT commit real values.
# Create it imperatively instead (values never touch git):
#
#   kubectl -n portfolio create secret generic portfolio-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=GATEWAY_TOKEN=$(openssl rand -hex 32) \
#     --from-literal=TELEGRAM_BOT_TOKEN=123456:ABC-...
#
# The image pull secret (ghcr-creds) is created from the host Docker login:
#
#   kubectl -n portfolio create secret docker-registry ghcr-creds \
#     --docker-server=ghcr.io \
#     --docker-username=BimaPangestu28 \
#     --docker-password=<GHCR_TOKEN_WITH_read:packages>
#
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  GATEWAY_TOKEN: "REPLACE_ME"
  TELEGRAM_BOT_TOKEN: "REPLACE_ME_OR_OMIT"
