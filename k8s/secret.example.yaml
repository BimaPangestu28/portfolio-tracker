# Template for the application secret. DO NOT commit real values.
# Create it imperatively instead (values never touch git):
#
#   kubectl -n portfolio create secret generic portfolio-secrets \
#     --from-literal=ANTHROPIC_API_KEY=<deepseek-key> \
#     --from-literal=GATEWAY_TOKEN=$(openssl rand -hex 32) \
#     --from-literal=TELEGRAM_BOT_TOKEN=123456:ABC-... \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=NEO4J_URI=neo4j+s://<id>.databases.neo4j.io \
#     --from-literal=NEO4J_PASSWORD=<strong-password> \
#     --from-literal=NEO4J_AUTH="neo4j/<same-password-as-NEO4J_PASSWORD>"
#
# NEO4J_URI: Aura URI (neo4j+s://...) or bolt://neo4j:7687 when self-hosting
# via k8s/50-neo4j.yaml. NEO4J_AUTH is only needed for self-hosting, and must
# be "neo4j/<same password as NEO4J_PASSWORD>".
#
# The image pull secret (ghcr-creds) is created from the host Docker login:
#
#   kubectl -n portfolio create secret docker-registry ghcr-creds \
#     --docker-server=ghcr.io \
#     --docker-username=BimaPangestu28 \
#     --docker-password=<GHCR_TOKEN_WITH_read:packages>
#
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  GATEWAY_TOKEN: "REPLACE_ME"
  CS_GATEWAY_TOKEN: "REPLACE_ME"
  TELEGRAM_BOT_TOKEN: "REPLACE_ME_OR_OMIT"
  # --- Long-term memory stack (memory-service + neo4j) ---
  OPENAI_API_KEY: "REPLACE_ME"
  # Aura URI (neo4j+s://...) or bolt://neo4j:7687 when self-hosting.
  NEO4J_URI: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME"
  # Only for self-hosted neo4j (k8s/50-neo4j.yaml); "neo4j/<NEO4J_PASSWORD>".
  NEO4J_AUTH: "neo4j/REPLACE_ME"
  # --- Google Calendar sync (optional; omit keys to disable) ---
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  GOOGLE_TOKEN_ENC_KEY: "REPLACE_ME_base64_32_bytes"
  # --- ClickUp freelance projects (optional; omit to disable) ---
  # Personal API token (pk_...) and the numeric Space id. Both kept in the
  # secret (this is a public repo), not in the committed manifest.
  CLICKUP_API_TOKEN: "REPLACE_ME_OR_OMIT"
  CLICKUP_SPACE_ID: "REPLACE_ME_OR_OMIT"
  # --- Upwork OAuth sync (optional; omit keys to disable) ---
  UPWORK_CLIENT_ID: "REPLACE_ME"
  UPWORK_CLIENT_SECRET: "REPLACE_ME"
  UPWORK_TOKEN_ENC_KEY: "REPLACE_ME_base64_32_bytes"
  # --- Invoicing (optional; INVOICE_ISSUER_NAME + INVOICE_ACCOUNT_NO required) ---
  # Issuer + bank details printed on every invoice. Kept in the secret (public repo).
  INVOICE_ISSUER_NAME: "REPLACE_ME_OR_OMIT"
  INVOICE_ISSUER_COMPANY: "REPLACE_ME_OR_OMIT"
  INVOICE_ISSUER_WEBSITE: "REPLACE_ME_OR_OMIT"
  INVOICE_BANK: "REPLACE_ME_OR_OMIT"
  INVOICE_ACCOUNT_NO: "REPLACE_ME_OR_OMIT"
  INVOICE_ACCOUNT_NAME: "REPLACE_ME_OR_OMIT"
