# Routes portfolio.catalystlabs.id to the frontend Service. cert-manager issues
# and renews the TLS certificate via the letsencrypt-prod ClusterIssuer (HTTP-01
# through the nginx ingress, which owns ports 80/443). The frontend's Caddy
# handles /api/* -> backend internally, so a single backend rule suffices.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTP basic auth in front of the whole app (the backend has no server-side
    # auth, so this is what protects the public endpoints — including the
    # WhatsApp pairing QR at /api/whatsapp/status). Create the secret with:
    #   htpasswd -nbB <user> <pass> > auth && \
    #   kubectl -n portfolio create secret generic portfolio-basic-auth --from-file=auth
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: portfolio-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Portfolio Tracker"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portfolio.catalystlabs.id
      secretName: portfolio-tls
  rules:
    - host: portfolio.catalystlabs.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
