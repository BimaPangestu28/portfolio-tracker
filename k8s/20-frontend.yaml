# The frontend image bundles Caddy + the built SPA. Behind the cluster ingress
# (which terminates TLS), Caddy must serve plain HTTP on :80 instead of its
# default auto-HTTPS, so we override its Caddyfile via this ConfigMap. Caddy
# still proxies /api/* to the backend Service and does SPA fallback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-caddy
  namespace: portfolio
data:
  Caddyfile: |
    :80 {
    	encode zstd gzip

    	handle_path /api/* {
    		reverse_proxy backend:8080
    	}

    	handle {
    		root * /srv
    		try_files {path} /index.html
    		file_server
    	}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: frontend
          image: ghcr.io/bimapangestu28/portfolio-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: caddyfile
          configMap:
            name: frontend-caddy
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: portfolio
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
